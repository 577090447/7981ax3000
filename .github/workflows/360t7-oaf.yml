#
# OpenWrt Builder - 360T7 / MT7981 (7673 + 20260601)
# 强制剔除 weechat/prosody，补 Lua5.4，官方底+覆盖
#

name: 360t7-oaf-7981 Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 360-oaf.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  SSH_ACTIONS: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a
        # 补 Lua5.4 依赖（防 prosody 警告，虽然后面会关 prosody）
        ./scripts/feeds install luafilesystem5.4 luaexpat5.4 luasec5.4 luasocket5.4 || true

    - name: Load custom configuration
      run: |
        cd openwrt
        [ -e files ] && mv files files.bak
        [ -d $GITHUB_WORKSPACE/files ] && cp -r $GITHUB_WORKSPACE/files .
        # 官方 360T7 底
        cp -f defconfig/mt7981-ax3000.config .config
        # 追加你的定制（必须含：关 MULTI_PROFILE、关 weechat/prosody、带 mt7981 固件）
        cat $GITHUB_WORKSPACE/$CONFIG_FILE >> .config
        # 强制剔除冲突包（双重保险，不依赖 .config 注释）
        sed -i 's/CONFIG_PACKAGE_luci-app-weechat=y/# CONFIG_PACKAGE_luci-app-weechat is not set/' .config
        sed -i 's/CONFIG_PACKAGE_weechat-full=y/# CONFIG_PACKAGE_weechat-full is not set/' .config
        sed -i 's/CONFIG_PACKAGE_weechat-minimal=y/# CONFIG_PACKAGE_weechat-minimal is not set/' .config
        sed -i 's/CONFIG_PACKAGE_prosody=y/# CONFIG_PACKAGE_prosody is not set/' .config
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make olddefconfig

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@main
      if: env.SSH_ACTIONS == 'true'
      with:
        mode: direct
      env:
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Download package
      run: |
        cd openwrt
        for i in 1 2 3; do
          make download -j8 && break
          echo "=== download retry $i ===" >&2
          sleep 15
        done
        find dl -size -1024c -exec rm -f {} \;
        ls -l dl/ | grep -E 'mt79xx_20250408|warp_20250408|datconf' || echo "::warning::关键dl包可能缺失"

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        if ! make -j$(nproc); then
          echo "=== parallel build failed, retry single-thread ==="
          make -j1 || \
          { echo "=== mt_wifi prepare ==="; make package/mtk/drivers/mt_wifi/prepare V=s -j1; \
            echo "=== mt_wifi compile ==="; make package/mtk/drivers/mt_wifi/compile V=s -j1; }
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_ENV

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success'
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: OpenWrt${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: steps.tag.outputs.status == 'success'
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
