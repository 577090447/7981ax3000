#
# OpenWrt Builder - 360T7 / MT7981 (7673 + 20260601)
# 单设备构建，含 HNAT 提示、Lua5.4 补装与 dl 缺包加固
#
# ⚠️ 刷机后务必保留 br-lan 中的 rxppd/rax0 接口，否则 HNAT 异常
#    （仓库官方要求：keep interface rxppd in your bridge device）
#

name: 360t7-oaf-7981 Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 360-oaf.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  SSH_ACTIONS: false                       # true=开启SSH调试, false=关闭

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ========== 1. 检出仓库 ==========
    - name: Checkout
      uses: actions/checkout@main

    # ========== 2. 初始化编译环境 ==========
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    # ========== 3. 克隆源码 ==========
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ========== 4. 加载自定义 feeds ==========
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    # ========== 5. 更新 & 安装 feeds（含 prosody 的 Lua5.4 依赖） ==========
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a
        # luci-app-ssr-plus 会拉 prosody，prosody 需要这四个 Lua5.4 变体包
        ./scripts/feeds install luafilesystem5.4 luaexpat5.4 luasec5.4 luasocket5.4
        # 校验是否已就绪
        for p in luafilesystem5.4 luaexpat5.4 luasec5.4 luasocket5.4; do
          if ! grep -qr "Package/$p" feeds/*/ ; then
            echo "::warning::feeds 中未找到 $p，prosody 可能编译失败"
          fi
        done

    # ========== 6. 加载自定义配置 ==========
    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        cd openwrt
        # 以官方 MT7981 配置为底（自动带入 360T7 设备定义与固件包）
        cp -f defconfig/mt7981-ax3000.config .config
        # 追加你的定制项（7673 / 20260601 / luci 插件等）
        [ -e "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cat "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH
        # 仅补全依赖，不覆盖已选的驱动版本与固件版本
        make olddefconfig
        # 确认关键项仍在
        grep -nE 'CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673|CONFIG_MTK_MT_WIFI_MT7981_20260601|DEVICE_qihoo_360t7' .config || echo "::warning::关键配置项缺失"

    # ========== 6.5 SSH 编译调试（按需开启） ==========
    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@main
      if: env.SSH_ACTIONS == 'true'
      with:
        mode: direct
      env:
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ========== 7. 下载依赖包（含重试与残缺清理） ==========
    - name: Download package
      run: |
        cd openwrt
        for i in 1 2 3; do
          make download -j8 && break
          echo "=== download retry $i ===" >&2
          sleep 15
        done
        # 清理小于1KB的残缺包，避免坏包被复用
        find dl -size -1024c -exec rm -f {} \;
        # 校验关键 tarball 已下载（按真实文件名匹配）
        for f in mt79xx_20250408-705eb4.tar.xz warp_20250408-5f71ec.tar.xz; do
          if [ ! -s "dl/$f" ]; then
            echo "::warning::关键 dl 包缺失: $f"
          fi
        done

    # ========== 8. 编译固件 ==========
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        if ! make -j$(nproc); then
          echo "=== parallel build failed, retry single-thread ===" >&2
          make -j1 || \
          { echo "=== mt_wifi prepare ==="; make package/mtk/drivers/mt_wifi/prepare V=s -j1; \
            echo "=== mt_wifi compile ==="; make package/mtk/drivers/mt_wifi/compile V=s -j1; }
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # ========== 9. 整理固件文件 ==========
    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # ========== 10. 生成 Release Tag ==========
    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_ENV

    # ========== 11. 上传固件到 Release ==========
    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success'
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: OpenWrt${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ========== 12. 清理旧 Releases（保留最新 3 个） ==========
    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: steps.tag.outputs.status == 'success'
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
